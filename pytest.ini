[pytest]

# ============ 失败重试（pytest-rerunfailures）============
# 失败后最多重试 2 次，用于应对 httpbin.org 这类网络抖动（flaky）
reruns = 2
# 每次重试前等待 1 秒，给网络一点缓冲
reruns_delay = 1

# ============ 默认命令行参数 ============
# 每次 pytest 自动带上 -v（详细输出），不用再手动敲
addopts = -v

# ============ 测试报告：手动 vs 自动 ============
# 手动生成：命令行加参数，想生成才生成
#   pytest --html=report.html --self-contained-html
#
# 自动生成：把 addopts 改成下面这行，每次 pytest 都出报告
#   addopts = -v --html=report.html --self-contained-html
#
# 两个参数说明：
#   --html=report.html     ：告诉 pytest 把报告写到哪个文件
#   --self-contained-html  ：把 CSS/JS 内嵌进单个 HTML 文件，双击即可打开，不用联网
#   （去掉 --self-contained-html，报告会拆成 report.html + assets/ 目录，样式单独放）
#
# 两种方式不冲突：命令行参数优先级高于本文件，配了也能临时覆盖

# ============ 测试文件匹配规则 ============
# 只收集 test_ 开头的 .py 文件
python_files = test_*.py
