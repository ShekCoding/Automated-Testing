[pytest]

# ============ 失败重试（pytest-rerunfailures）============
# 失败后最多重试 2 次，用于应对 httpbin.org 这类网络抖动（flaky）
reruns = 2
# 每次重试前等待 1 秒，给网络一点缓冲
reruns_delay = 1

# ============ 默认命令行参数 ============
# 每次 pytest 自动带上 -v（详细输出），不用再手动敲
addopts = -v

# ============ 测试文件匹配规则 ============
# 只收集 test_ 开头的 .py 文件
python_files = test_*.py
